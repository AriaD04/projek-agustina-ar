<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Scene 6 — Tantangan Proyek | AR Ekosistem</title>
  <link rel="stylesheet" href="shared.css"/>
  <link rel="stylesheet" href="scene-6.css"/>
</head>
<body>

  <div id="canvas-container"><canvas id="c"></canvas></div>
  <div id="scene-fade"></div>
  <div id="glb-status"></div>

  <div id="hud" style="display:none;">
    <div id="scene-title">Scene 6 — Tantangan Proyek</div>
    <div id="scene-counter"></div>
  </div>

  <div id="narasi" style="display:none;"><p id="narasi-text"></p></div>
  <div id="interact-ui" style="display:none;"></div>

  <div id="info-panel">
    <span id="info-close" onclick="closeInfo()">&#x2715;</span>
    <div id="info-title">Judul</div>
    <div id="info-body">Isi informasi</div>
  </div>

  <div id="tag-container" style="display:none;"></div>
  <div id="scene1-labels" style="display:none;"></div>
  <div id="slider-ui" style="display:none;"></div>
  <div id="builder-ui" style="display:none;"></div>
  <div id="balance-meter" style="display:none;"></div>
  <div id="score-ui" style="display:none;"></div>
  <div id="outro" style="display:none;"></div>

  <div id="nav" style="display:none;">
    <button class="nav-btn" onclick="prevScene()">&#x2039; Prev</button>
    <div id="scene-dots"></div>
    <button class="nav-btn primary" onclick="nextScene()">Next &#x203A;</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/DragControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js" onerror="window.__gltfLoaderPreloaded=false;"></script>
  <script>window.__gltfLoaderPreloaded = (typeof THREE !== 'undefined' && typeof THREE.GLTFLoader === 'function');</script>
  <script src="shared.js"></script>
  <script src="scene-6.js"></script>
</body>
</html>
